name: frontend-web

# CI for the web app that actually gets deployed (frontend-web/, TanStack Start).
# The separate `frontend.yml` covers the legacy Expo mobile app in `frontend/`.

on:
  push:
    paths: ["frontend-web/**", ".github/workflows/frontend-web.yml"]
  pull_request:
    paths: ["frontend-web/**", ".github/workflows/frontend-web.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Build to catch anything type/lint miss (SSR bundling, imports, etc.).
      - run: npm run build
