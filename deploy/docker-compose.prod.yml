# Production stack for a single EC2 (see docs/DEPLOYMENT.md §9).
# Frontend is hosted separately on Cloudflare Pages, so it's not here.
#
# The `api` image is built by CI and pulled from GHCR — do NOT build on the box.
# Replace OWNER below with your GitHub username/org (lowercase).
#
# Run it with `--env-file .env.prod`:
#
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
#
# `env_file:` only injects variables INTO a container. The `${VAR}` placeholders
# below are substituted by Compose itself, which reads `.env` unless you pass
# `--env-file`. Without the flag they expand to empty strings, and coturn would
# start with flags like `--realm=`.

services:
  api:
    image: ghcr.io/vanhne161204/englishtalker-api:latest
    env_file: .env.prod
    expose: ["8000"] # internal only — reached by Caddy, never published to the host
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No `ports:` — the database is reachable only on the internal compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  # TURN relay for room voice (see docs/DEPLOYMENT.md §10).
  #
  # Without this, WebRTC only has STUN, so a call works between two browsers on
  # one machine but fails between two devices — mobile carriers and most office
  # networks use symmetric NAT, where no direct peer path exists.
  #
  # `network_mode: host` is required: coturn hands out its own IP/ports inside
  # the ICE candidates, and Docker's bridge NAT would advertise unreachable
  # container addresses. Set TURN_EXTERNAL_IP / TURN_INTERNAL_IP / TURN_REALM /
  # TURN_USER / TURN_PASSWORD in `.env.prod`.
  #
  # Every ${VAR} below uses `:?` so a missing value stops the deploy. Compose
  # otherwise substitutes an empty string and coturn starts *successfully* with
  # `--realm=` and `--user=:` — a relay that accepts connections but rejects
  # every allocation, which looks identical to a network problem from the app.
  coturn:
    image: coturn/coturn:4.6.2-alpine
    network_mode: host
    command:
      - -n # no config file — everything is on this command line
      - --log-file=stdout
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      # Bind and relay on the host's real NIC only. Under `network_mode: host`
      # coturn otherwise auto-discovers the Docker bridges (172.17.0.1,
      # 172.19.0.1) as relay addresses and round-robins across them, so some
      # allocations land on an interface the internet cannot reach and the call
      # fails for no visible reason.
      - "--listening-ip=${TURN_INTERNAL_IP:?set TURN_INTERNAL_IP in .env.prod - the EC2 private IP}"
      - "--relay-ip=${TURN_INTERNAL_IP:?set TURN_INTERNAL_IP in .env.prod - the EC2 private IP}"
      - "--realm=${TURN_REALM:?set TURN_REALM in .env.prod}"
      - "--user=${TURN_USER:?set TURN_USER in .env.prod}:${TURN_PASSWORD:?set TURN_PASSWORD in .env.prod}"
      # `public/private` maps the relay socket to the Elastic IP, so candidates
      # carry the address peers can actually route to.
      - "--external-ip=${TURN_EXTERNAL_IP:?set TURN_EXTERNAL_IP in .env.prod}/${TURN_INTERNAL_IP}"
      - --lt-cred-mech # long-term credentials: the username/password the browser sends
      - --fingerprint
      - --no-cli # no telnet admin port
      - --no-tlsv1
      - --no-tlsv1_1
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
