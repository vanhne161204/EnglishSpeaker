# Production stack for a single EC2 (see docs/DEPLOYMENT.md §9).
# Frontend is hosted separately on Cloudflare Pages, so it's not here.
#
# The `api` image is built by CI and pulled from GHCR — do NOT build on the box.
# Replace OWNER below with your GitHub username/org (lowercase).

services:
  api:
    image: ghcr.io/vanhne161204/englishtalker-api:latest
    env_file: .env.prod
    expose: ["8000"] # internal only — reached by Caddy, never published to the host
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No `ports:` — the database is reachable only on the internal compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
