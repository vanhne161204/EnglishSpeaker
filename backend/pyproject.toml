[project]
name = "englishtalker-backend"
version = "0.1.0"
description = "EnglishTalker API — FastAPI backend"
requires-python = ">=3.12"

# Runtime dependencies are declared in requirements.txt (used by Docker and CI).
# This file holds tooling configuration only, so there is a single source of truth
# for runtime deps.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
# B008: FastAPI's `Depends()` in argument defaults is the framework's intended idiom.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
plugins = []
