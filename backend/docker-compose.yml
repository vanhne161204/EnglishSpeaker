# Full local stack: API + PostgreSQL (pgvector) + Redis.
# Usage: docker compose up --build   ->   API at http://localhost:8000/docs

services:
  api:
    build: .
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://englishtalker:englishtalker@db:5432/englishtalker
      REDIS_URL: redis://redis:6379/0
      AUTO_CREATE_TABLES: "true" # demo convenience; switch to `alembic upgrade head` for real deploys
      # Frontend origins allowed to call the API (add your prod domain on deploy).
      CORS_ORIGINS: '["http://localhost:8080","http://127.0.0.1:8080","http://localhost:5173","http://localhost:3000"]'
      # Dev-only signing secret. In production set a strong random value
      # (e.g. `openssl rand -hex 32`) — the app refuses to start otherwise.
      SECRET_KEY: "dev-secret-not-for-production-change-me"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: englishtalker
      POSTGRES_PASSWORD: englishtalker
      POSTGRES_DB: englishtalker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U englishtalker"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
