# Full local stack: API + PostgreSQL (pgvector) + Redis + coturn (TURN for voice).
# Usage: docker compose up --build   ->   API at http://localhost:8000/docs
#
# Cross-device voice (phone ↔ laptop): both devices must reach the API by your
# LAN IP (not 127.0.0.1). Add your LAN frontend origin to CORS_ORIGINS below,
# set VITE_API_BASE_URL + VITE_TURN_URL in frontend-web/.env.local — see
# frontend-web/.env.example.

services:
  api:
    build: .
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://englishtalker:englishtalker@db:5432/englishtalker
      REDIS_URL: redis://redis:6379/0
      AUTO_CREATE_TABLES: "true" # demo convenience; switch to `alembic upgrade head` for real deploys
      # Frontend origins allowed to call the API. For phone testing on Wi‑Fi, add
      # your LAN URL, e.g. "http://192.168.1.10:8080".
      CORS_ORIGINS: '["http://localhost:8080","http://127.0.0.1:8080","http://localhost:5173","http://localhost:3000"]'
      # Dev-only signing secret. In production set a strong random value
      # (e.g. `openssl rand -hex 32`) — the app refuses to start otherwise.
      SECRET_KEY: "dev-secret-not-for-production-change-me"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: englishtalker
      POSTGRES_PASSWORD: englishtalker
      POSTGRES_DB: englishtalker
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U englishtalker"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # TURN relay for WebRTC when peers are on different devices/networks.
  # Point frontend-web/.env.local at turn:<your-lan-ip>:3478 with user dev / devpass.
  coturn:
    image: coturn/coturn:4.6.2-alpine
    restart: unless-stopped
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --realm=englishtalker.local
      - --user=dev:devpass
      - --lt-cred-mech
      - --fingerprint

volumes:
  pgdata:
